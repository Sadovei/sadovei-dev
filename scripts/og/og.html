<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("fonts/Inter-500-latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-600-latin.woff2") format("woff2"); font-weight: 600; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; align-items: center; gap: 64px; padding: 0 88px;
    background: #0f1214; color: #e8edf0; font-family: "Inter", sans-serif;
  }
  .text { flex: 1; }
  .eyebrow { color: #5cc3d3; font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  h1 { font-family: "Source Serif 4", serif; font-weight: 600; font-size: 76px; line-height: 1.05; margin-top: 18px; }
  .role { font-size: 34px; color: #e8edf0; margin-top: 18px; }
  .clients { font-size: 26px; color: #9ba6b1; margin-top: 28px; }
  .url { font-size: 26px; color: #5cc3d3; margin-top: 36px; font-weight: 600; }
  img { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; border: 6px solid #142328; }
</style>
</head>
<body>
  <div class="text">
    <p class="eyebrow">Independent contractor · Remote B2B</p>
    <h1>Radu Sadovei</h1>
    <p class="role">Senior Frontend Developer: React, Next.js, React Native</p>
    <p class="clients">The LEGO Group · SITA · RBC Capital Markets · PGL</p>
    <p class="url">sadovei.dev</p>
  </div>
  <img src="photo.jpg" alt="">
</body>
</html>
